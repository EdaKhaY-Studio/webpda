<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080504" />
      <stop offset="30%" stop-color="#0E0A08" />
      <stop offset="70%" stop-color="#140E0B" />
      <stop offset="100%" stop-color="#070403" />
    </linearGradient>

    <!-- Aura Glows -->
    <radialGradient id="argonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#32BDF6" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#1596CE" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#32BDF6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="hydrogenCoreAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F45B1A" stop-opacity="0.55" />
      <stop offset="40%" stop-color="#FF7A3D" stop-opacity="0.25" />
      <stop offset="80%" stop-color="#F45B1A" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#F45B1A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="carbonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B94312" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#F45B1A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#B94312" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- 2. Ambient Auras -->
  <circle cx="240" cy="310" r="220" fill="url(#argonAura)" />
  <circle cx="600" cy="290" r="300" fill="url(#hydrogenCoreAura)" />
  <circle cx="960" cy="310" r="220" fill="url(#carbonAura)" />

  <!-- 3. Tech Grid Lines & Geometric Connections -->
  <g stroke="#F45B1A" stroke-opacity="0.12" stroke-width="1.2">
    <!-- Connecting Horizon Bus Lines -->
    <path d="M 120 310 L 460 290 L 740 290 L 1080 310" stroke-dasharray="4 6" />
    <path d="M 80 180 L 1120 180" stroke-opacity="0.06" />
    <path d="M 80 440 L 1120 440" stroke-opacity="0.06" />

    <!-- Isometric diagonal grid lines -->
    <line x1="240" y1="120" x2="240" y2="480" stroke="#32BDF6" stroke-opacity="0.15" />
    <line x1="600" y1="80" x2="600" y2="520" stroke="#F45B1A" stroke-opacity="0.2" />
    <line x1="960" y1="120" x2="960" y2="480" stroke="#B94312" stroke-opacity="0.15" />
  </g>

  <!-- 4. Top Eyebrow Badge -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#17100D" stroke="#F45B1A" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="-110" cy="0" r="4" fill="#F45B1A" />
    <text x="0" y="5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="12" fill="#F7F1EB" text-anchor="middle" letter-spacing="2.5">PAHAM DIGITAL · ARTIKEL 06</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 5. LEFT NODE: ARGON (Satpam Junior Terlatih)               -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(240, 310)">
    <!-- Node Backdrop -->
    <rect x="-110" y="-110" width="220" height="220" rx="28" fill="#0C151D" stroke="#32BDF6" stroke-opacity="0.45" stroke-width="1.5" />
    <!-- Outer Shield / Hex Ring -->
    <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="none" stroke="#32BDF6" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 4" />
    
    <!-- Central Argon Symbol Node -->
    <circle cx="0" cy="-15" r="36" fill="#0A1824" stroke="#32BDF6" stroke-width="2" filter="url(#softGlow)" />
    <text x="0" y="-5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#32BDF6" text-anchor="middle" letter-spacing="1">Ar</text>

    <!-- Node Labels -->
    <text x="0" y="45" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#F7F1EB" text-anchor="middle" letter-spacing="2">ARGON</text>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#32BDF6" text-anchor="middle" letter-spacing="1">SATPAM JUNIOR TERLATIH</text>
    <text x="0" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="400" font-size="10" fill="#94A3B8" text-anchor="middle">Software Engineering Harian</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 6. CENTER NODE: HYDROGEN (Satpam Senior Muda - Gesit)       -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(600, 280)">
    <!-- Dynamic Multi-ring Energy Halo -->
    <circle cx="0" cy="-10" r="145" fill="none" stroke="#F45B1A" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="10 8" />
    <circle cx="0" cy="-10" r="125" fill="none" stroke="#FF7A3D" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="16 12" />
    
    <!-- Center Capsule Chassis -->
    <rect x="-140" y="-130" width="280" height="250" rx="36" fill="#1C110C" stroke="#F45B1A" stroke-opacity="0.8" stroke-width="2" filter="url(#softGlow)" />
    
    <!-- Orbital Nodes (Motion-inspired) -->
    <circle cx="-105" cy="-10" r="7" fill="#F45B1A" filter="url(#softGlow)" />
    <circle cx="105" cy="-10" r="7" fill="#F45B1A" filter="url(#softGlow)" />
    <circle cx="0" cy="-115" r="7" fill="#F45B1A" filter="url(#softGlow)" />
    <circle cx="0" cy="95" r="7" fill="#F45B1A" filter="url(#softGlow)" />

    <!-- Center Hydrogen Core -->
    <circle cx="0" cy="-20" r="52" fill="#2E160C" stroke="#FF7A3D" stroke-width="3" filter="url(#strongGlow)" />
    <!-- Hydrogen Atom Symbol H -->
    <text x="0" y="-5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">H</text>

    <!-- Speed / Energy Badge -->
    <rect x="-70" y="40" width="140" height="24" rx="12" fill="#F45B1A" />
    <text x="0" y="56" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">2.5x LEBIH GESIT</text>

    <!-- Labels -->
    <text x="0" y="86" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#F7F1EB" text-anchor="middle" letter-spacing="2">HYDROGEN</text>
    <text x="0" y="105" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12" fill="#F45B1A" text-anchor="middle" letter-spacing="1">SATPAM SENIOR MUDA</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 7. RIGHT NODE: CARBON (Satpam Senior Veteran Spesialis)     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(960, 310)">
    <!-- Node Backdrop -->
    <rect x="-110" y="-110" width="220" height="220" rx="28" fill="#180F0C" stroke="#B94312" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Outer Octagonal Ring -->
    <polygon points="-40,-75 40,-75 75,-40 75,40 40,75 -40,75 -75,40 -75,-40" fill="none" stroke="#B94312" stroke-opacity="0.3" stroke-width="1.2" stroke-dasharray="6 4" />
    
    <!-- Central Carbon Symbol Node -->
    <circle cx="0" cy="-15" r="36" fill="#24110A" stroke="#B94312" stroke-width="2" filter="url(#softGlow)" />
    <text x="0" y="-5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#FF7A3D" text-anchor="middle" letter-spacing="1">C</text>

    <!-- Node Labels -->
    <text x="0" y="45" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#F7F1EB" text-anchor="middle" letter-spacing="2">CARBON</text>
    <text x="0" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="11" fill="#FF7A3D" text-anchor="middle" letter-spacing="1">SATPAM SENIOR VETERAN</text>
    <text x="0" y="84" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="400" font-size="10" fill="#A99A90" text-anchor="middle">Deep Reasoning &amp; Audit</text>
  </g>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- 8. BOTTOM EDITORIAL HEADLINE BLOCK                          -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <g transform="translate(600, 560)">
    <!-- Main Headline in White & Orange -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="42" fill="#F7F1EB" text-anchor="middle" letter-spacing="1.5">
      GEMINI 4 <tspan fill="#F45B1A">HYDROGEN</tspan>
    </text>
    <text x="0" y="32" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="16" fill="#F7F1EB" text-anchor="middle" letter-spacing="3.5">
      AI GOOGLE YANG LEBIH GESIT
    </text>
    <text x="0" y="58" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="600" font-size="12" fill="#A99A90" text-anchor="middle" letter-spacing="4">
      ARGON · HYDROGEN · CARBON
    </text>
  </g>

  <!-- 9. Subtle Border Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />
</svg>